# lab-metadata.yml
# Single Point of Truth for Lab Information

lab:
  name: "Create and Manage Podman Pods"
  shortname: "zt-podman-pods"
  maintainer: "Nate Lager (nlager@redhat.com)" 
  
  description:
    summary: "Learn how to group containers into Podman Pods and deploy a multi-service application as one unit"
    goal: "Users leave this hands-on scenario with knowledge they can apply to their own container workloads: running a multi-service application as a single pod, letting its pieces talk over shared localhost, publishing only the ports that need to be reachable, connecting dependent services by name on a user-defined network, and keeping service data alive across container replacement."
    concepts:
      - "Create a pod in podman"
      - "Run containers inside a pod"
      - "The infra container and pod networking"
      - "Publish ports at the pod level"
      - "Configure containers via mounted files"
      - "User-defined networks and name-based DNS"
      - "Persistent volumes that outlive containers"
    use_case: "Deploy multi-service container applications as a single pod"
    time_to_complete: "30"
    
  git_ref:
    production: "main"
    development: "dev"

